<!DOCTYPE html>
<html lang="es" data-tema="lila">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi rinconcito</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4f5;--card:#fffdf7;--ink:#3b3354;--soft:#8c84a6;--acc:#b9a6ee;--tape:#ffe08a;--ok:#9ad8bc;--line:#e4dcf3;--star:#ffc531;--r:20px}
[data-tema=menta]{--bg:#dff1e8;--acc:#8fd0b2;--line:#d3eadf}
[data-tema=cielo]{--bg:#dcebf8;--acc:#90c3ee;--line:#cfe2f3}
[data-tema=rosa]{--bg:#fbe3ea;--acc:#f5a9c0;--line:#f3d3dc}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Fredoka,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:99px;padding:6px 14px;background:var(--acc);font-weight:500}
button:hover{filter:brightness(.95)}
input,select{border:2px solid var(--line);border-radius:12px;padding:5px 10px;background:#fff;min-width:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px}
#fecha{display:flex;gap:14px;align-items:center}
#fecha .num{font-size:64px;font-weight:600;line-height:1;background:var(--card);border-radius:18px;padding:6px 16px;box-shadow:0 4px 0 var(--acc)}
#fecha b{font-size:22px;text-transform:capitalize}
.hol{display:inline-block;background:var(--tape);border-radius:99px;padding:2px 12px;font-size:14px;margin:2px 4px 0 0}
.prox{font-size:14px;color:var(--soft)}
nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav button{background:var(--card);opacity:.6;padding:5px 11px;font-size:14px}
nav button.on{opacity:1;box-shadow:inset 0 -3px 0 var(--acc)}
.dot{width:22px;height:22px;padding:0;border:2px solid #fff}
#unlock{background:var(--tape);font-size:16px;padding:9px 18px;box-shadow:0 3px 0 #e6c24f}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;padding:6px 18px 40px;align-items:start}
.card{background:var(--card);border-radius:var(--r);padding:20px 18px 16px;position:relative}
.card h2{position:absolute;top:-11px;left:16px;margin:0;font-size:14px;font-weight:500;background:var(--tape);padding:2px 12px;transform:rotate(-2deg)}
.wide{grid-column:span 2}@media(max-width:700px){.wide{grid-column:auto}}
.clks{display:flex;justify-content:space-around;text-align:center}
.clk b{display:block;font-size:30px;font-weight:600}.clk span{font-size:13px;color:var(--soft)}
#frase p{font:600 28px/1.15 Caveat,cursive;margin:6px 0 0}
#frase small{color:var(--soft)}
.polaroid{background:#fff;padding:10px 10px 6px;transform:rotate(-1.5deg);box-shadow:0 3px 10px #3b335422;text-align:center}
.polaroid img{width:100%;height:250px;object-fit:cover;display:block;background:var(--line)}
.polaroid p{margin:6px 0 0;font:600 20px Caveat,cursive}
.mini{background:none;color:var(--soft);font-size:13px;padding:3px 8px;text-decoration:underline}
.hr,.days{display:grid;grid-template-columns:1fr repeat(7,28px) 46px;gap:2px;align-items:center}
.days i{font-style:normal;text-align:center;font-size:12px;color:var(--soft)}.days i.now{color:var(--ink);font-weight:600}
.hr{padding:3px 0;border-top:1px dashed var(--line)}.hn{font-size:15px}.hn input{width:44px}
.star{background:none;padding:0;font-size:24px;color:var(--line);line-height:1;transition:transform .15s}
.star.on{color:var(--star);transform:scale(1.15)}
.hr small{text-align:right;color:var(--soft)}.hr small.ok{color:#2f9c73;font-weight:600}
.add{display:flex;gap:6px;margin-top:10px}.add input{flex:1}
.tk{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.tk span{flex:1}.tk.done span{text-decoration:line-through;opacity:.45}
.tk .p{background:none;padding:0;font-size:18px}.tk input{width:20px;height:20px;accent-color:var(--acc)}
.tm{font-size:64px;font-weight:600;text-align:center;line-height:1.1}
.pm{display:flex;gap:6px;justify-content:center;margin:6px 0}.pm button.on{box-shadow:inset 0 -3px 0 var(--ink)}
.set{display:flex;gap:8px;justify-content:center;font-size:13px;color:var(--soft);flex-wrap:wrap}.set input{width:52px}
.rm{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}.rm span{flex:1}.rm input{width:56px}
#ov{position:fixed;inset:0;background:#3b335499;display:grid;place-items:center;padding:20px;z-index:9}
.box{background:var(--card);border-radius:28px;padding:28px;max-width:440px;text-align:center}
.box h3{font:600 34px/1.1 Caveat,cursive;margin:0 0 8px}.box button{margin:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;transition:transform .3s;z-index:10;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div id="fecha"></div>
  <nav><button id="unlock">🌱 Ayúdame a empezar</button><span id="dock"></span><span id="temas"></span></nav>
</header>
<main>
  <section class="card" data-w="reloj"><h2>🕰️ Mis horas</h2><div class="clks" id="relojes"></div></section>
  <section class="card" data-w="frase" id="frase"><h2>💌 Para hoy</h2><small id="hola"></small><p id="fr"></p></section>
  <section class="card" data-w="foto"><h2>📷 Un recuerdo</h2><div id="ft"></div><div class="add"><label class="mini" for="up">＋ añadir fotos</label><input type="file" id="up" accept="image/*" multiple hidden><button class="mini" id="delph">quitar esta</button></div></section>
  <section class="card wide" data-w="hab"><h2>⭐ Mis hábitos</h2><div id="hab"></div>
    <div class="add"><input id="nh" placeholder="Nuevo hábito…" maxlength="40"><button id="addh">Añadir</button><button class="mini" id="edh">editar metas</button></div></section>
  <section class="card" data-w="tareas"><h2>✅ Mi semana</h2><div id="tl"></div>
    <div class="add"><input id="nt" placeholder="Nueva tarea…" maxlength="80"><select id="np"><option value="0">🔴 Hoy</option><option value="1">🟡 2-3 días</option><option value="2">🟢 Fin de semana</option></select><button id="addt">＋</button></div>
    <button class="mini" id="clr">limpiar las hechas</button></section>
  <section class="card" data-w="pomo"><h2>🍅 Enfoque y descanso</h2><div class="tm" id="tm"></div><div class="pm" id="modes"></div>
    <div class="pm"><button id="go">▶ Iniciar</button><button id="rs">↺</button></div>
    <div class="set">trabajo <input type="number" id="sw" min="1" max="120"> descanso <input type="number" id="ss" min="1" max="60"> largo <input type="number" id="sl" min="1" max="60"></div>
    <p class="prox" style="text-align:center;margin:8px 0 0" id="pc"></p></section>
  <section class="card" data-w="rec"><h2>💧 Cuidarme</h2><div id="rl"></div><button class="mini" id="notif">activar avisos del navegador</button></section>
</main>
<div id="ov" hidden><div class="box"><h3 id="ovt"></h3><p id="ovp"></p><button id="ovgo">Empezar ahora</button><button id="ovno">Otra cosita</button><button class="mini" id="ovx">cerrar</button></div></div>
<div id="toast" role="status"></div>

<script>
/* ============ ✏️ AQUÍ PERSONALIZAS TÚ ============ */
const CONFIG={
  nombre:"Hermana",   // ← su nombre o apodo
  // Una frase por día, en este orden. Agrega las que quieras (si se acaban, vuelve a empezar).
  frases:[
    "Eres más capaz de lo que crees, y más querida de lo que imaginas.",
    "Hoy basta con una cosita a la vez. Yo creo en ti.",
    "Descansar también es avanzar.",
    "Estamos lejos, pero estoy contigo en cada examen."
  ],
  // Fechas especiales: m=mes (1-12), d=día
  fechas:[
    {m:10,d:20,t:"🎂 ¡Tu cumpleaños!"}
  ],
  habitos:[{n:"Tomar agua",g:7},{n:"Salir a caminar",g:4},{n:"Dormir antes de la 1am",g:5}], // g = estrellas meta por semana
  relojes:[["Valencia","Europe/Madrid"],["CDMX","America/Mexico_City"],["Manizales","America/Bogota"]],
  recordatorios:[{t:"💧 Toma agua, aunque sea un vasito.",min:45},{t:"🍽️ ¿Ya comiste algo rico? Tu cerebro lo necesita.",min:180}],
  pomodoro:{w:25,s:5,l:15,c:4}, // trabajo, descanso, descanso largo (min), ciclos antes del largo
  // Opcional: fotos ya subidas al repositorio, p. ej. ["fotos/casa1.jpg","fotos/abuela.jpg"]
  fotos:[]
};
/* ================================================= */

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem("r_"+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem("r_"+k,JSON.stringify(v))}catch(e){}};
const P=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate());
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),9000)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.start();o.stop(a.currentTime+1)}catch(e){}}
function notify(m){toast(m);beep();try{if(Notification.permission==="granted")new Notification("Mi rinconcito",{body:m})}catch(e){}}

/* ---- Fecha y feriados ---- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,Math.floor((h+l-7*m+114)/31)-1,(h+l-7*m+114)%31+1)}
function nthMon(y,m,n){const d=new Date(y,m,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d}
function feriados(y){const e=easter(y),L=[],A=(m,d,t,f)=>L.push([new Date(y,m-1,d),t,f]),D=(x,t,f)=>L.push([x,t,f]),S=n=>{const x=new Date(e);x.setDate(x.getDate()+n);return x};
  A(1,1,"Año Nuevo","🇲🇽🇪🇸");D(nthMon(y,1,1),"Día de la Constitución","🇲🇽");D(nthMon(y,2,3),"Natalicio de Benito Juárez","🇲🇽");A(5,1,"Día del Trabajo","🇲🇽🇪🇸");A(9,16,"Independencia de México","🇲🇽");A(11,2,"Día de Muertos","🇲🇽");D(nthMon(y,10,3),"Revolución Mexicana","🇲🇽");A(12,25,"Navidad","🇲🇽🇪🇸");
  A(1,6,"Reyes Magos","🇪🇸");A(3,19,"San José","🇪🇸 Valencia");A(8,15,"Asunción","🇪🇸");A(10,9,"Día de la Comunitat Valenciana","🇪🇸 Valencia");A(10,12,"Fiesta Nacional de España","🇪🇸");A(11,1,"Todos los Santos","🇪🇸");A(12,6,"Día de la Constitución","🇪🇸");A(12,8,"Inmaculada","🇪🇸");D(S(-2),"Viernes Santo","🇪🇸");D(S(1),"Lunes de Pascua","🇪🇸 Valencia");
  return L}
function drawFecha(){const n=new Date(),y=n.getFullYear(),k=key(n);
  const todos=[...feriados(y),...feriados(y+1),...[y,y+1].flatMap(yy=>CONFIG.fechas.map(f=>[new Date(yy,f.m-1,f.d),f.t,"💜"]))].sort((a,b)=>a[0]-b[0]);
  const hoy=todos.filter(x=>key(x[0])===k),prox=todos.find(x=>x[0]>new Date(y,n.getMonth(),n.getDate()));
  const dd=prox?Math.round((prox[0]-new Date(y,n.getMonth(),n.getDate()))/864e5):0;
  $("#fecha").innerHTML=`<div class="num">${n.getDate()}</div><div><b>${n.toLocaleDateString("es",{weekday:"long"})}</b><br>${n.toLocaleDateString("es",{month:"long",year:"numeric"})}<br>${hoy.map(h=>`<span class="hol">${h[2]} ${esc(h[1])}</span>`).join("")}${prox?`<div class="prox">Próximo: ${esc(prox[2]+" "+prox[1])} · en ${dd} día${dd>1?"s":""}</div>`:""}</div>`}

/* ---- Widgets (abrir/cerrar) y temas ---- */
const WS=[["reloj","🕰️ Horas"],["frase","💌 Frase"],["foto","📷 Recuerdo"],["hab","⭐ Hábitos"],["tareas","✅ Tareas"],["pomo","🍅 Enfoque"],["rec","💧 Cuidarme"]];
let V=load("v",{});
function drawDock(){$("#dock").innerHTML=WS.map(([id,t])=>`<button class="${V[id]===false?"":"on"}" data-id="${id}">${t}</button>`).join("");
  document.querySelectorAll("[data-w]").forEach(c=>c.hidden=V[c.dataset.w]===false)}
$("#dock").onclick=e=>{const id=e.target.dataset.id;if(!id)return;V[id]=V[id]===false;save("v",V);drawDock()};
const TEMAS={lila:"#b9a6ee",menta:"#8fd0b2",cielo:"#90c3ee",rosa:"#f5a9c0"};
$("#temas").innerHTML=Object.entries(TEMAS).map(([t,c])=>`<button class="dot" style="background:${c}" data-t="${t}" aria-label="Tema ${t}"></button>`).join("");
$("#temas").onclick=e=>{const t=e.target.dataset.t;if(t){document.documentElement.dataset.tema=t;save("tema",t)}};
document.documentElement.dataset.tema=load("tema","lila");

/* ---- Relojes y frase ---- */
function drawClk(){$("#relojes").innerHTML=CONFIG.relojes.map(([n,z])=>`<div class="clk"><b>${new Date().toLocaleTimeString("es",{timeZone:z,hour:"2-digit",minute:"2-digit",hour12:false})}</b><span>${esc(n)}</span></div>`).join("")}
$("#hola").textContent="Hola, "+CONFIG.nombre;
$("#fr").textContent=CONFIG.frases[dayNum()%CONFIG.frases.length];

/* ---- Fotos (guardadas en este navegador) ---- */
const idb=new Promise((ok,no)=>{const r=indexedDB.open("rincon",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=no});
const st=async(mode,fn)=>{const db=await idb;return new Promise((ok,no)=>{const t=db.transaction("f",mode),q=fn(t.objectStore("f"));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
let cur=null;
async function drawFoto(){let keys=[],vals=[];try{keys=await st("readonly",s=>s.getAllKeys());vals=await st("readonly",s=>s.getAll())}catch(e){}
  const L=[...CONFIG.fotos.map(u=>({u})),...vals.map((b,i)=>({b,k:keys[i]}))];
  if(!L.length){$("#ft").innerHTML='<div class="polaroid"><p>Añade tus fotos de casa 🏡</p></div>';cur=null;return}
  cur=L[((dayNum()*2654435761)>>>0)%L.length];
  $("#ft").innerHTML=`<div class="polaroid"><img alt="Recuerdo del día" src="${cur.u||URL.createObjectURL(cur.b)}"><p>un pedacito de casa</p></div>`}
$("#up").onchange=async e=>{for(const f of e.target.files)await st("readwrite",s=>s.add(f));e.target.value="";drawFoto()};
$("#delph").onclick=async()=>{if(cur&&cur.k!==undefined&&confirm("¿Quitar esta foto?")){await st("readwrite",s=>s.delete(cur.k));drawFoto()}};

/* ---- Hábitos ---- */
let H=load("h",{list:CONFIG.habitos.map((h,i)=>({id:"h"+i,n:h.n,g:h.g})),done:{}}),editH=false;
function drawH(){const w=H.done[key(monday(new Date()))]||{},dow=(new Date().getDay()+6)%7;
  $("#hab").innerHTML=`<div class="days"><span></span>${[..."LMXJVSD"].map((d,i)=>`<i class="${i==dow?"now":""}">${d}</i>`).join("")}<span></span></div>`+H.list.map(h=>{const r=w[h.id]||[],n=r.filter(Boolean).length;
    return `<div class="hr"><div class="hn">${esc(h.n)}${editH?` meta <input type="number" min="1" max="7" value="${h.g}" data-g="${h.id}"> <button class="mini" data-x="${h.id}">quitar</button>`:""}</div>${[0,1,2,3,4,5,6].map(i=>`<button class="star ${r[i]?"on":""}" data-s="${h.id}:${i}" aria-label="Día ${i+1}">★</button>`).join("")}<small class="${n>=h.g?"ok":""}">${n}/${h.g}${n>=h.g?" 🎉":""}</small></div>`}).join("")}
$("#hab").onclick=e=>{const b=e.target,wk=key(monday(new Date()));
  if(b.dataset.s){const[id,i]=b.dataset.s.split(":"),w=H.done[wk]||(H.done[wk]={}),r=w[id]||(w[id]=[]);r[i]=!r[i]}
  else if(b.dataset.x){H.list=H.list.filter(h=>h.id!==b.dataset.x)}else return;save("h",H);drawH()};
$("#hab").onchange=e=>{const id=e.target.dataset.g;if(id){H.list.find(h=>h.id===id).g=Math.min(7,Math.max(1,+e.target.value||1));save("h",H);drawH()}};
$("#addh").onclick=()=>{const v=$("#nh").value.trim();if(v){H.list.push({id:"h"+Date.now(),n:v,g:5});$("#nh").value="";save("h",H);drawH()}};
$("#edh").onclick=()=>{editH=!editH;$("#edh").textContent=editH?"listo":"editar metas";drawH()};

/* ---- Tareas ---- */
const PRI=["🔴","🟡","🟢"],PN=["Hoy","2-3 días","Fin de semana"];
let T=load("t",[]);const wk0=key(monday(new Date()));
if(load("tw","")!==wk0){T=T.filter(t=>!t.done);save("t",T);save("tw",wk0)}
function drawT(){const L=[...T].sort((a,b)=>a.done-b.done||a.p-b.p);
  $("#tl").innerHTML=L.length?L.map(t=>`<div class="tk ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} data-d="${t.id}" aria-label="Hecha"><span>${esc(t.t)}</span><button class="p" data-p="${t.id}" title="${PN[t.p]} (toca para cambiar)">${PRI[t.p]}</button><button class="mini" data-r="${t.id}">✕</button></div>`).join(""):'<p class="prox">Nada por ahora 🌿 Añade una cosita pequeña.</p>'}
$("#tl").onclick=e=>{const b=e.target,f=id=>T.find(t=>t.id==id);
  if(b.dataset.d){const t=f(b.dataset.d);t.done=!t.done;if(t.done)toast("¡Una menos! 🎉")}
  else if(b.dataset.p){const t=f(b.dataset.p);t.p=(t.p+1)%3}
  else if(b.dataset.r){T=T.filter(t=>t.id!=b.dataset.r)}else return;save("t",T);drawT()};
$("#addt").onclick=()=>{const v=$("#nt").value.trim();if(v){T.push({id:Date.now(),t:v,p:+$("#np").value,done:false});$("#nt").value="";save("t",T);drawT()}};
$("#nt").onkeydown=e=>{if(e.key==="Enter")$("#addt").click()};
$("#clr").onclick=()=>{T=T.filter(t=>!t.done);save("t",T);drawT()};

/* ---- Pomodoro ---- */
let S=load("ps",CONFIG.pomodoro),pm={mode:"w",run:false,end:0,left:S.w*60,n:load("pn",{d:key(new Date()),n:0})};
if(pm.n.d!==key(new Date()))pm.n={d:key(new Date()),n:0};
const MODES={w:["Trabajo","w"],s:["Descanso","s"],l:["Descanso largo","l"]},dur=()=>S[pm.mode]*60;
function pmStart(){if(!pm.run){pm.run=true;pm.end=Date.now()+pm.left*1000}}
function pmSet(m){pm.mode=m;pm.run=false;pm.left=dur();drawPm()}
function pmDone(){pm.run=false;beep();
  if(pm.mode==="w"){pm.n.n++;save("pn",pm.n);const l=pm.n.n%S.c===0;notify(l?"¡Gran bloque! Descanso largo: estírate, come algo y toma agua 💜":"¡Bien hecho! Descansa: toma agua y mueve el cuerpo 💧");pm.mode=l?"l":"s"}
  else{notify("Descanso terminado. ¿Lista para otro bloque?");pm.mode="w"}
  pm.left=dur()}
function drawPm(){if(pm.run){pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));if(!pm.left)pmDone()}
  const t=P(Math.floor(pm.left/60))+":"+P(pm.left%60);$("#tm").textContent=t;document.title=pm.run?t+" · Mi rinconcito":"Mi rinconcito";
  $("#modes").innerHTML=Object.entries(MODES).map(([k,[n]])=>`<button class="${pm.mode===k?"on":""}" data-m="${k}">${n}</button>`).join("");
  $("#go").textContent=pm.run?"⏸ Pausa":"▶ Iniciar";$("#pc").textContent=pm.n.n?`Hoy llevas ${pm.n.n} bloque${pm.n.n>1?"s":""} 🍅`:""}
$("#modes").onclick=e=>{if(e.target.dataset.m)pmSet(e.target.dataset.m)};
$("#go").onclick=()=>{if(pm.run){pm.run=false}else pmStart();drawPm()};
$("#rs").onclick=()=>pmSet(pm.mode);
[["sw","w"],["ss","s"],["sl","l"]].forEach(([id,k])=>{$("#"+id).value=S[k];$("#"+id).onchange=e=>{S[k]=Math.max(1,+e.target.value||S[k]);save("ps",S);if(!pm.run){pm.left=dur();drawPm()}}});

/* ---- Recordatorios ---- */
let RM=load("rm",CONFIG.recordatorios.map(r=>r.min));const RL=CONFIG.recordatorios.map(r=>({...r,last:Date.now()}));
function drawR(){$("#rl").innerHTML=RL.map((r,i)=>`<div class="rm"><span>${esc(r.t)}</span><input type="number" min="5" max="600" value="${RM[i]}" data-i="${i}" aria-label="minutos"> min <button class="mini" data-ok="${i}">hecho ✓</button></div>`).join("")}
$("#rl").onchange=e=>{const i=e.target.dataset.i;if(i!==undefined){RM[i]=Math.max(5,+e.target.value||RM[i]);save("rm",RM)}};
$("#rl").onclick=e=>{const i=e.target.dataset.ok;if(i!==undefined){RL[i].last=Date.now();toast("¡Qué bien te cuidas! 💜")}};
$("#notif").onclick=()=>{try{Notification.requestPermission().then(p=>toast(p==="granted"?"Avisos activados ✨":"No se activaron los avisos"))}catch(e){}};
setInterval(()=>RL.forEach((r,i)=>{if(Date.now()-r.last>=RM[i]*6e4){r.last=Date.now();notify(r.t)}}),15000);

/* ---- Desbloqueo de parálisis ---- */
let pick=null;
function unlock(){const open=T.filter(t=>!t.done);$("#ov").hidden=false;
  if(!open.length){$("#ovt").textContent="Lista vacía 🌱";$("#ovp").textContent="Añade una cosita pequeña a tus tareas y elijo por ti.";$("#ovgo").hidden=$("#ovno").hidden=true;return}
  $("#ovgo").hidden=$("#ovno").hidden=false;const m=Math.min(...open.map(t=>t.p));let pool=open.filter(t=>t.p===m);
  if(pool.length>1&&pick)pool=pool.filter(t=>t.id!==pick.id);pick=pool[Math.floor(Math.random()*pool.length)];
  $("#ovt").textContent=pick.t;$("#ovp").textContent="Solo los primeros 5 minutos. Después decides si sigues. Yo elijo, tú solo empiezas 💜"}
$("#unlock").onclick=()=>{pick=null;unlock()};$("#ovno").onclick=unlock;$("#ovx").onclick=()=>$("#ov").hidden=true;
$("#ovgo").onclick=()=>{$("#ov").hidden=true;pmSet("w");pmStart();drawPm()};
document.onkeydown=e=>{if(e.key==="Escape")$("#ov").hidden=true};

/* ---- Arranque ---- */
drawFecha();drawDock();drawClk();drawFoto();drawH();drawT();drawPm();drawR();
setInterval(()=>{drawClk();drawPm()},1000);setInterval(drawFecha,6e4);
</script>
</body>
</html>
